name: CI

on:
  # Recover a replaced pending main run without another code or report-only push.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    # Task reports are deliveries: run their full checks and production gates.
    # Ordered patterns keep unrelated Markdown filtered, then re-include projects.
    paths:
      - "**"
      - "!**.md"
      - "projects/**"

# Concurrency belongs to jobs: a shared main workflow group can replace a
# pending run before checks even start, including with cancel-in-progress:false.

permissions:
  contents: read

defaults:
  run:
    shell: bash # explicit bash = -eo pipefail

env:
  # Build-time placeholder only: Better Auth throws without a secret when NODE_ENV=production.
  # Deployed functions read the real value from the Vercel project env at runtime.
  BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-0123456789abcdef

jobs:
  checks:
    if: github.event.action != 'closed'
    # PR updates replace stale checks; main pushes and manual recovery each keep
    # their own checks, independently of the serialized production queue.
    concurrency:
      group: ci-checks-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Pinned: ubuntu-latest is migrating to 26.04; move deliberately, not by drift.
    runs-on: ubuntu-24.04
    # Run 40820018472 exhausted 960s at the peep-box cases, before the palace
    # and remaining browser coverage. Run 40837465689 exhausted 1200s without assertion failures. Allow 1800s for the serial suite,
    # 32m for readiness/TERM/diagnostics, and 50m for all probes.
    # Individual assertions retain their timeouts; exit 124 still fails the job.
    # Motion's paced auth requests explain its 171s; no runtime browser installers in CI.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: otohime
          POSTGRES_PASSWORD: otohime
          POSTGRES_DB: otohime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otohime -d otohime"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://otohime:otohime@localhost:5432/otohime
      BETTER_AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      GHOSTS_ENDPOINT: ws://127.0.0.1:8788/ghosts
      GHOSTS_FAKE_BASE: http://127.0.0.1:8788
    steps:
      - uses: actions/checkout@v7
        with:
          # Inspect every commit in a push, including a code commit followed by a report commit.
          fetch-depth: 0
      - name: Check guestbook delivery author
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            commits="$GITHUB_SHA"
          else
            commits="$(git rev-list "$PUSH_BEFORE..$GITHUB_SHA")"
          fi
          for commit in $commits; do
            if git diff-tree --no-commit-id --name-only -r "$commit" | grep -Eq '^(app/api/guestbook/|lib/guestbook[^/]*|e2e/guestbook-api\.test\.ts$|db/schema\.ts$|db/migrations/)'; then
              author="$(git show -s --format='%an <%ae>' "$commit")"
              # Local commits and GitHub squash merges use these owner spellings.
              if [ "$author" != 'Otohime <quiinthieu@gmail.com>' ] && [ "$author" != 'Ōtohime <quiinthieu@gmail.com>' ]; then
                echo "Guestbook delivery $commit has an undeployable author: $author" >&2
                exit 1
              fi
            fi
          done
      - name: Check Vercel deployment author
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          DEPLOY_AUTHOR_EMAIL: quiinthieu@gmail.com
        run: node scripts/check-deploy-author.mjs
      # Restored before npm ci so hashFiles never walks node_modules.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The job log needs a token to read: on a red run each failed unit test also becomes an annotation and a step
      # summary section (scripts/tap-annotate.mjs, from the TAP kept here). pipefail keeps npm test's own status.
      - name: npm test
        id: unit
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.tap"
      - name: Annotate failed unit tests
        if: failure() && steps.unit.outcome == 'failure'
        run: node scripts/tap-annotate.mjs "$RUNNER_TEMP/npm-test.tap"
      # The production deploy script against a fake npx, here so GNU timeout (not the macOS fallback) is exercised.
      - run: bash scripts/vercel-deploy.test.sh
      # verify-deploy.sh against a local fake /api/health: a sha mismatch must exit nonzero without running the e2e.
      - run: bash scripts/verify-deploy.sh --self-test
      # probe-history.sh against local fixture health/pages/git: stale leaves, wrong totals and moving deploys must fail.
      - run: bash scripts/probe-history.sh --self-test
      # public/ask-index.json is built from content/site.ts and the Gazette; a content edit must regenerate it.
      - run: npm run ask:check
      - name: Migrations match db/schema.ts
        run: |
          npx drizzle-kit check
          npm run db:generate
          # generate wrote files = schema changed without a committed migration
          test -z "$(git status --porcelain db/migrations)"
      - run: npm run history:index -- --strict --rev="$GITHUB_SHA"
      - run: npm run history:check -- --strict --rev="$GITHUB_SHA"
      - name: Refresh public stamp ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ledger-fetch.mjs
      - run: npm run build
      - run: npm run history:check -- --strict --rev="$GITHUB_SHA"
      - name: Real CPU camera and privacy verifier
        timeout-minutes: 5
        run: |
          set -o pipefail
          trap 'status=$?; trap - EXIT; node scripts/browser-gate-diagnostics.mjs "Real CPU camera and privacy verifier" "$status" "$RUNNER_TEMP/camera-probe.log" || true; exit "$status"' EXIT
          status=0
          SKIP_BUILD=1 node scripts/verify-peep-box-camera.mjs 2>&1 | tee "$RUNNER_TEMP/camera-probe.log" || status=$?
          node scripts/ci-probe-annotate.mjs "Real CPU camera and privacy verifier" "$status" "$RUNNER_TEMP/camera-probe.log" || true
          exit "$status"
      - run: npm run db:migrate
      - name: Publish application build identity
        run: |
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.env.RUNNER_TEMP + "/app-build.json", JSON.stringify({appSha: process.env.GITHUB_SHA, nextBuildId: fs.readFileSync(".next/BUILD_ID", "utf8").trim()}) + "\n")'
      - uses: actions/upload-artifact@v6
        with:
          name: app-build-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/app-build.json
          if-no-files-found: error
      - name: Start local ghost fake
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ghosts-fake.mjs --port 8788 --origins "$BASE_URL" >"$RUNNER_TEMP/ghosts-fake.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/ghosts-fake.pid"
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 "$GHOSTS_FAKE_BASE/__ready"
      # Keep per-assertion reporting; the EXIT fallback also covers readiness and pre-reporter crashes.
      - name: E2E against next start
        timeout-minutes: 32
        run: |
          set -o pipefail
          trap 'status=$?; trap - EXIT; node scripts/browser-gate-diagnostics.mjs "E2E against next start" "$status" "$RUNNER_TEMP/e2e.log" || true; exit "$status"' EXIT
          : >"$RUNNER_TEMP/e2e.log"
          npm start >"$RUNNER_TEMP/next-start.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health" 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"
          command -v timeout >/dev/null 2>&1 || timeout() { node -e 'const {spawn}=require("node:child_process");const a=process.argv.slice(1);while(a[0]?.startsWith("-"))a.shift();const ms=parseFloat(a.shift())*1000;const c=spawn(a[0],a.slice(1),{stdio:"inherit",detached:true});let timedOut=false;const t=setTimeout(()=>{timedOut=true;try{process.kill(-c.pid,"SIGTERM")}catch{};setTimeout(()=>{try{process.kill(-c.pid,"SIGKILL")}catch{}},1000)},ms);c.on("exit",(code)=>{clearTimeout(t);process.exit(timedOut?124:code??1)})' -- "$@"; }
          node --experimental-strip-types --disable-warning=ExperimentalWarning --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-name-pattern="phone touch" e2e/assembly-sky.test.ts 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"
          timeout --signal=TERM --kill-after=10s 1800s npm run test:e2e 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"
      # Signs in through the form against the same server and database, so a page error on the hop into a
      # signed-in room turns the job red. It signs up and deletes its own *-<run>@probe.test accounts.
      - name: Motion probe, signed in
        timeout-minutes: 8
        run: |
          set -o pipefail
          trap 'status=$?; trap - EXIT; node scripts/browser-gate-diagnostics.mjs "Motion probe, signed in" "$status" "$RUNNER_TEMP/motion-probe.log" || true; exit "$status"' EXIT
          : >"$RUNNER_TEMP/motion-probe.log"
          # The server the e2e step left running; start one again if it has gone.
          curl -fsS "$BASE_URL/api/health" >/dev/null 2>&1 || {
            npm start >"$RUNNER_TEMP/next-start.log" 2>&1 &
            curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health" 2>&1 | tee -a "$RUNNER_TEMP/motion-probe.log"
          }
          status=0
          bash scripts/probe-motion-signed-in.sh 2>&1 | tee -a "$RUNNER_TEMP/motion-probe.log" || status=$?
          node scripts/ci-probe-annotate.mjs "Motion probe, signed in" "$status" "$RUNNER_TEMP/motion-probe.log" || true
          exit "$status"
      - name: Footer walk
        timeout-minutes: 8
        run: |
          set -o pipefail
          trap 'status=$?; trap - EXIT; node scripts/browser-gate-diagnostics.mjs "Footer walk" "$status" "$RUNNER_TEMP/footer-walk.log" || true; exit "$status"' EXIT
          : >"$RUNNER_TEMP/footer-walk.log"
          curl -fsS "$BASE_URL/api/health" >/dev/null 2>&1 || {
            npm start >"$RUNNER_TEMP/next-start.log" 2>&1 &
            curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health" 2>&1 | tee -a "$RUNNER_TEMP/footer-walk.log"
          }
          status=0
          EXPECT_SHA="$GITHUB_SHA" bash scripts/walk-end.sh 2>&1 | tee -a "$RUNNER_TEMP/footer-walk.log" || status=$?
          node scripts/ci-probe-annotate.mjs "Footer walk" "$status" "$RUNNER_TEMP/footer-walk.log" || true
          exit "$status"
      - name: Footer Chromium probe
        timeout-minutes: 8
        run: |
          set -o pipefail
          trap 'status=$?; trap - EXIT; node scripts/browser-gate-diagnostics.mjs "Footer Chromium probe" "$status" "$RUNNER_TEMP/footer-probe.log" || true; exit "$status"' EXIT
          : >"$RUNNER_TEMP/footer-probe.log"
          curl -fsS "$BASE_URL/api/health" >/dev/null 2>&1 || {
            npm start >"$RUNNER_TEMP/next-start.log" 2>&1 &
            curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health" 2>&1 | tee -a "$RUNNER_TEMP/footer-probe.log"
          }
          status=0
          EXPECT_SHA="$GITHUB_SHA" bash scripts/probe-end.sh 2>&1 | tee -a "$RUNNER_TEMP/footer-probe.log" || status=$?
          node scripts/ci-probe-annotate.mjs "Footer Chromium probe" "$status" "$RUNNER_TEMP/footer-probe.log" || true
          exit "$status"

      - name: Stop local ghost fake
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ghosts-fake.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ghosts-fake.pid")" 2>/dev/null || true
          fi

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ci-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Preview settings are present
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          missing=$(for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEON_API_KEY NEON_PROJECT_ID; do [ -n "${!v}" ] || printf '%s ' "$v"; done)
          if [ -n "$missing" ]; then echo "::error::Set these repo secrets/variables for previews: $missing(see README → Deploying)"; exit 1; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Neon branch (create or reuse)
        run: |
          # Retries cover Neon's 423 "project has running operations" (concurrent PRs).
          neon() { curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $NEON_API_KEY" -H "Content-Type: application/json" "$@"; }
          id=$(neon "$NEON_API/branches?search=$NEON_BRANCH" | jq -r --arg n "$NEON_BRANCH" 'first(.branches[] | select(.name == $n) | .id)')
          if [ -z "$id" ]; then
            # Child of the default (production) branch; the expiry backstops a missed cleanup.
            body=$(jq -n --arg n "$NEON_BRANCH" --arg e "$(date -u -d '+14 days' +%FT%TZ)" \
              '{branch: {name: $n, expires_at: $e}, endpoints: [{type: "read_write"}]}')
            id=$(neon -X POST "$NEON_API/branches" -d "$body" | jq -r .branch.id)
          fi
          uri() { neon "$NEON_API/connection_uri?branch_id=$id&database_name=neondb&role_name=neondb_owner&pooled=$1" | jq -r .uri; }
          direct=$(uri false)
          pooled=$(uri true)
          # Child branches inherit production's role password: mask it before anything can print it.
          echo "::add-mask::$(node -p 'new URL(process.argv[1]).password' "$direct")"
          { echo "DATABASE_URL=$direct"; echo "DATABASE_URL_POOLED=$pooled"; } >> "$GITHUB_ENV"
      - run: npx --yes --package=vercel@64.7.0 --package=@types/estree@1.0.9 -- vercel pull --yes --environment=preview
      - run: npm run history:index -- --strict --rev="$GITHUB_SHA"
      - run: npm run history:check -- --strict --rev="$GITHUB_SHA"
      - name: Refresh public stamp ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ledger-fetch.mjs
      - run: npx --yes --package=vercel@64.7.0 --package=@types/estree@1.0.9 -- vercel build
      - run: npm run history:check -- --strict --rev="$GITHUB_SHA"
      - run: npm run db:migrate # DATABASE_URL = direct URL of the PR branch
      - name: Deploy
        id: deploy
        run: |
          # Assign first: a failed deploy inside echo "$(…)" would not fail the step.
          url=$(npx --yes --package=vercel@64.7.0 --package=@types/estree@1.0.9 -- vercel deploy --prebuilt --archive=tgz --env DATABASE_URL="$DATABASE_URL_POOLED")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test (vercel curl adds the protection bypass)
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: npx --yes --package=vercel@64.7.0 --package=@types/estree@1.0.9 -- vercel curl "$URL/api/health" --yes -- --fail --silent --show-error
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL (Neon branch $NEON_BRANCH)"

  production:
    needs: checks
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Only deploys share a slot. A newer pending deploy can replace an older
    # pending one; running deploys finish. QA proves delivery by live ancestry,
    # never by the existence of a queued job or an assumption of commit order.
    concurrency:
      group: otohime-production-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Setup + pull + build + migrate take about 2 minutes (run 40311256064: pull 13 s, build 31 s, migrate 3 s);
    # the deploy script bounds the upload at 5 and readiness at 7, and the terminal/press e2e after it takes
    # about 2 (107 s against otohime.dev), so this is only a backstop.
    timeout-minutes: 18
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      # `vercel pull` writes "[SENSITIVE]" for sensitive vars, and process env
      # wins over that file. The build needs a real URL; functions read the
      # Vercel value at runtime.
      BETTER_AUTH_URL: https://otohime.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Vercel deployment author
        env:
          DEPLOY_AUTHOR_EMAIL: quiinthieu@gmail.com
        run: node scripts/check-deploy-author.mjs
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx --yes --package=vercel@64.7.0 --package=@types/estree@1.0.9 -- vercel pull --yes --environment=production
      - name: Refresh public stamp ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ledger-fetch.mjs
      # Build before migrating: a failed build never leaves prod migrated ahead of its code.
      - name: Build production bundle with strict changelog history
        run: |
          npm run history:index -- --strict --rev="$GITHUB_SHA"
          npm run history:check -- --strict --rev="$GITHUB_SHA"
          npx --yes --package=vercel@64.7.0 --package=@types/estree@1.0.9 -- vercel build --prod
          npm run history:check -- --strict --rev="$GITHUB_SHA"
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # Upload with --no-wait (5 min bound), wait for ready (7 min bound), then require /api/health to
      # report this commit; a hang ends in a public ::error with the deployment state instead of a timeout.
      - name: Deploy and verify the served sha
        # Upload 5 + ready 7 is the deploy's own budget; the job's 18 also covers the verify step below.
        timeout-minutes: 12
        run: bash scripts/vercel-deploy.sh
      # The live site must serve this commit and pass the terminal, press and postcard HTTP/browser flows.
      # These tests run read-only against https://otohime.dev with the runner's Google Chrome.
      - name: Verify the deployed sha, terminal, press and postcards
        run: EXPECT_SHA="$GITHUB_SHA" bash scripts/verify-deploy.sh https://otohime.dev
      - name: Verify deployed palace changelog history
        run: EXPECT_SHA="$GITHUB_SHA" bash scripts/probe-history.sh https://otohime.dev

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete Neon branch (no-op if absent)
        run: |
          neon() { curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $NEON_API_KEY" "$@"; }
          id=$(neon "$NEON_API/branches?search=$NEON_BRANCH" | jq -r --arg n "$NEON_BRANCH" 'first(.branches[] | select(.name == $n) | .id)')
          if [ -n "$id" ]; then neon -X DELETE "$NEON_API/branches/$id" > /dev/null; fi
