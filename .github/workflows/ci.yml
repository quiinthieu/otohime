name: CI

on:
  # Recover a replaced pending main run without another code or report-only push.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    # Report-only pushes (plan reports, *.md) never enter the main queue. A push
    # that also touches code still runs, because every changed file must match.
    paths-ignore:
      - "projects/**"
      - "**.md"

# Concurrency belongs to jobs: a shared main workflow group can replace a
# pending run before checks even start, including with cancel-in-progress:false.

permissions:
  contents: read

defaults:
  run:
    shell: bash # explicit bash = -eo pipefail

env:
  # Build-time placeholder only: Better Auth throws without a secret when NODE_ENV=production.
  # Deployed functions read the real value from the Vercel project env at runtime.
  BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-0123456789abcdef

jobs:
  checks:
    if: github.event.action != 'closed'
    # PR updates replace stale checks; main pushes and manual recovery each keep
    # their own checks, independently of the serialized production queue.
    concurrency:
      group: ci-checks-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Pinned: ubuntu-latest is migrating to 26.04; move deliberately, not by drift.
    runs-on: ubuntu-24.04
    # A green job takes 10-11 min (research_run-8877: E2E 230-300 s, signed-in motion probe 171-180 s, footer
    # probe 55 s, the rest npm ci, lint, typecheck, tests and build). Run 40307460821 hit the old 20 min only
    # because the motion probe spent 14 min in its network installers (npm i playwright, playwright install
    # --with-deps); the probes now drive the runner's Chrome with the locked playwright-core and install
    # nothing in CI, so 20 min is about 9 min of headroom. Each browser probe step also has its own 8-minute
    # bound, so a stall fails that step by name instead of cancelling the whole job.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: otohime
          POSTGRES_PASSWORD: otohime
          POSTGRES_DB: otohime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otohime -d otohime"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://otohime:otohime@localhost:5432/otohime
      BETTER_AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          # Inspect every commit in a push, including a code commit followed by a report commit.
          fetch-depth: 0
      - name: Check guestbook delivery author
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            commits="$GITHUB_SHA"
          else
            commits="$(git rev-list "$PUSH_BEFORE..$GITHUB_SHA")"
          fi
          for commit in $commits; do
            if git diff-tree --no-commit-id --name-only -r "$commit" | grep -Eq '^(app/api/guestbook/|lib/guestbook[^/]*|e2e/guestbook-api\.test\.ts$)'; then
              author="$(git show -s --format='%an <%ae>' "$commit")"
              if [ "$author" != 'Otohime <quiinthieu@gmail.com>' ]; then
                echo "Guestbook delivery $commit has an undeployable author: $author" >&2
                exit 1
              fi
            fi
          done
      # Restored before npm ci so hashFiles never walks node_modules.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The job log needs a token to read: on a red run each failed unit test also becomes an annotation and a step
      # summary section (scripts/tap-annotate.mjs, from the TAP kept here). pipefail keeps npm test's own status.
      - name: npm test
        id: unit
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.tap"
      - name: Annotate failed unit tests
        if: failure() && steps.unit.outcome == 'failure'
        run: node scripts/tap-annotate.mjs "$RUNNER_TEMP/npm-test.tap"
      # The production deploy script against a fake npx, here so GNU timeout (not the macOS fallback) is exercised.
      - run: bash scripts/vercel-deploy.test.sh
      # verify-deploy.sh against a local fake /api/health: a sha mismatch must exit nonzero without running the e2e.
      - run: bash scripts/verify-deploy.sh --self-test
      # public/ask-index.json is built from content/site.ts and the Gazette; a content edit must regenerate it.
      - run: npm run ask:check
      - name: Migrations match db/schema.ts
        run: |
          npx drizzle-kit check
          npm run db:generate
          # generate wrote files = schema changed without a committed migration
          test -z "$(git status --porcelain db/migrations)"
      - run: npm run build
      - run: npm run db:migrate
      # The job log needs a token to read: a failed test is also an annotation and a step summary section
      # (scripts/e2e-annotate.mjs), and a red step adds the server's last lines there, with what ran.
      - name: E2E against next start
        run: |
          npm start >"$RUNNER_TEMP/next-start.log" 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health"
          status=0
          npm run test:e2e || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "## E2E environment"
              echo
              echo "- commit $GITHUB_SHA, build $(cat .next/BUILD_ID), node $(node -v), $(google-chrome --version 2>/dev/null || echo 'no google-chrome'), $(nproc) CPUs"
              echo
              echo "### next start, last 80 lines"
              echo
              echo '```'
              tail -n 80 "$RUNNER_TEMP/next-start.log" | sed 's/```/ˋˋˋ/g'
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            tail -n 80 "$RUNNER_TEMP/next-start.log"
          fi
          exit "$status"
      # Signs in through the form against the same server and database, so a page error on the hop into a
      # signed-in room turns the job red. It signs up and deletes its own *-<run>@probe.test accounts.
      - name: Motion probe, signed in
        timeout-minutes: 8
        run: |
          # The server the e2e step left running; start one again if it has gone.
          curl -fsS "$BASE_URL/api/health" >/dev/null 2>&1 || {
            npm start &
            curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health"
          }
          bash scripts/probe-motion-signed-in.sh
      - name: Footer walk
        timeout-minutes: 8
        run: |
          curl -fsS "$BASE_URL/api/health" >/dev/null 2>&1 || {
            npm start &
            curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health"
          }
          EXPECT_SHA="$GITHUB_SHA" bash scripts/walk-end.sh
      - name: Footer Chromium probe
        timeout-minutes: 8
        run: |
          curl -fsS "$BASE_URL/api/health" >/dev/null 2>&1 || {
            npm start &
            curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$BASE_URL/api/health"
          }
          EXPECT_SHA="$GITHUB_SHA" bash scripts/probe-end.sh

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ci-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Preview settings are present
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          missing=$(for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEON_API_KEY NEON_PROJECT_ID; do [ -n "${!v}" ] || printf '%s ' "$v"; done)
          if [ -n "$missing" ]; then echo "::error::Set these repo secrets/variables for previews: $missing(see README → Deploying)"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Neon branch (create or reuse)
        run: |
          # Retries cover Neon's 423 "project has running operations" (concurrent PRs).
          neon() { curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $NEON_API_KEY" -H "Content-Type: application/json" "$@"; }
          id=$(neon "$NEON_API/branches?search=$NEON_BRANCH" | jq -r --arg n "$NEON_BRANCH" 'first(.branches[] | select(.name == $n) | .id)')
          if [ -z "$id" ]; then
            # Child of the default (production) branch; the expiry backstops a missed cleanup.
            body=$(jq -n --arg n "$NEON_BRANCH" --arg e "$(date -u -d '+14 days' +%FT%TZ)" \
              '{branch: {name: $n, expires_at: $e}, endpoints: [{type: "read_write"}]}')
            id=$(neon -X POST "$NEON_API/branches" -d "$body" | jq -r .branch.id)
          fi
          uri() { neon "$NEON_API/connection_uri?branch_id=$id&database_name=neondb&role_name=neondb_owner&pooled=$1" | jq -r .uri; }
          direct=$(uri false)
          pooled=$(uri true)
          # Child branches inherit production's role password: mask it before anything can print it.
          echo "::add-mask::$(node -p 'new URL(process.argv[1]).password' "$direct")"
          { echo "DATABASE_URL=$direct"; echo "DATABASE_URL_POOLED=$pooled"; } >> "$GITHUB_ENV"
      - run: npx vercel@64 pull --yes --environment=preview
      - run: npx vercel@64 build
      - run: npm run db:migrate # DATABASE_URL = direct URL of the PR branch
      - name: Deploy
        id: deploy
        run: |
          # Assign first: a failed deploy inside echo "$(…)" would not fail the step.
          url=$(npx vercel@64 deploy --prebuilt --archive=tgz --env DATABASE_URL="$DATABASE_URL_POOLED")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test (vercel curl adds the protection bypass)
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: npx vercel@64 curl "$URL/api/health" --yes -- --fail --silent --show-error
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL (Neon branch $NEON_BRANCH)"

  production:
    needs: checks
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Only deploys share a slot. A newer pending deploy can replace an older
    # pending one; running deploys finish. QA proves delivery by live ancestry,
    # never by the existence of a queued job or an assumption of commit order.
    concurrency:
      group: otohime-production-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Setup + pull + build + migrate take about 2 minutes (run 40311256064: pull 13 s, build 31 s, migrate 3 s);
    # the deploy script bounds the upload at 5 and readiness at 7, and the terminal/press e2e after it takes
    # about 2 (107 s against otohime.dev), so this is only a backstop.
    timeout-minutes: 18
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      # `vercel pull` writes "[SENSITIVE]" for sensitive vars, and process env
      # wins over that file. The build needs a real URL; functions read the
      # Vercel value at runtime.
      BETTER_AUTH_URL: https://otohime.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx vercel@64 pull --yes --environment=production
      # Build before migrating: a failed build never leaves prod migrated ahead of its code.
      - run: npx vercel@64 build --prod
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # Upload with --no-wait (5 min bound), wait for ready (7 min bound), then require /api/health to
      # report this commit; a hang ends in a public ::error with the deployment state instead of a timeout.
      - name: Deploy and verify the served sha
        run: bash scripts/vercel-deploy.sh
      # The live site must serve this commit (bounded poll) and still have the Pocket Terminal and the /play
      # Ink Poster Press: their e2e files run read-only against https://otohime.dev (runner's Google Chrome).
      - name: Verify the deployed sha, terminal and press
        run: EXPECT_SHA="$GITHUB_SHA" bash scripts/verify-deploy.sh https://otohime.dev

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
      NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete Neon branch (no-op if absent)
        run: |
          neon() { curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $NEON_API_KEY" "$@"; }
          id=$(neon "$NEON_API/branches?search=$NEON_BRANCH" | jq -r --arg n "$NEON_BRANCH" 'first(.branches[] | select(.name == $n) | .id)')
          if [ -n "$id" ]; then neon -X DELETE "$NEON_API/branches/$id" > /dev/null; fi
